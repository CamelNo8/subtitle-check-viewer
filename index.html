<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>字幕チェック</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: #1f2328;
        background: #ffffff;
      }
      .controls {
        padding: 12px 16px;
        border-bottom: 1px solid #d1d9e0;
      }
      .controls form {
        display: flex;
        max-width: 100%;
        gap: 8px;
        align-items: center;
      }
      .controls label {
        white-space: nowrap;
      }
      .controls input[type="url"] {
        width: 480px;
        min-width: 0;
        padding: 6px 8px;
        font-size: 1rem;
      }
      .message {
        margin: 8px 0 0;
        color: #cf222e;
      }
      .message:empty {
        display: none;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        gap: 16px;
        padding: 16px;
      }
      .video-frame {
        aspect-ratio: 16 / 9;
        background: #000000;
      }
      .video-frame iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* 字幕の文字の大きさを動画の幅に合わせるため、この欄の幅を cqw の基準にする */
      .video-column {
        container-type: inline-size;
      }
      .subtitle-bar {
        --line-height: 1.4;
        /* 動画の幅に比例させるが、狭い画面でも読めるよう 16px より小さくしない */
        --min-font-size: 16px;
        min-height: calc(2em * var(--line-height));
        padding: 0.4em 1em;
        background: #000000;
        color: #ffffff;
        font-size: max(var(--min-font-size), 3.2cqw);
        line-height: var(--line-height);
        text-align: center;
      }
      .subtitle-panel {
        display: flex;
        flex-direction: column;
      }
      .srt-drop-zone {
        display: flex;
        flex: 1;
        min-height: 160px;
        align-items: center;
        justify-content: center;
        border: 2px dashed #8c959f;
        border-radius: 8px;
        color: #59636e;
        text-align: center;
        cursor: pointer;
      }
      .srt-drop-zone:hover,
      .srt-drop-zone:focus-within,
      .srt-drop-zone.is-dragover {
        border-color: #0969da;
        background: #ddf4ff;
        color: #0969da;
      }
      /* 見た目は枠で出すので本来の入力欄は隠す。キーボード操作と読み上げのために要素は残す */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .srt-status {
        margin: 8px 0 0;
      }
      .srt-status:empty {
        display: none;
      }
      .srt-status.is-error {
        color: #cf222e;
      }
      .srt-warnings {
        margin: 4px 0 0;
        color: #9a6700;
      }
      .srt-warnings:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <header class="controls">
      <form id="video-form" novalidate>
        <label for="video-url">YouTube URL</label>
        <input
          id="video-url"
          type="url"
          placeholder="https://www.youtube.com/watch?v=..."
          autocomplete="off"
        />
      </form>
      <p id="message" class="message" role="alert"></p>
    </header>
    <main class="workspace">
      <div class="video-column">
        <section class="video-frame">
          <div id="player"></div>
        </section>
        <div id="subtitle-bar" class="subtitle-bar"></div>
      </div>
      <aside id="subtitle-panel" class="subtitle-panel">
        <label id="srt-drop-zone" class="srt-drop-zone">
          SRTファイルを選択 or ドラッグ
          <input id="srt-file" class="visually-hidden" type="file" accept=".srt" />
        </label>
        <p id="srt-status" class="srt-status" role="status"></p>
        <ul id="srt-warnings" class="srt-warnings"></ul>
      </aside>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
