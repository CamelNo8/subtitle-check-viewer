<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>字幕チェック</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: #1f2328;
        background: #ffffff;
      }
      .controls {
        padding: 12px 16px;
        border-bottom: 1px solid #d1d9e0;
      }
      .controls form {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .controls input[type="url"] {
        flex: 1;
        max-width: 640px;
        padding: 6px 8px;
        font-size: 1rem;
      }
      .message {
        margin: 8px 0 0;
        color: #cf222e;
      }
      .message:empty {
        display: none;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        gap: 16px;
        padding: 16px;
      }
      .video-frame {
        aspect-ratio: 16 / 9;
        background: #000000;
      }
      .video-frame iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <header class="controls">
      <form id="video-form" novalidate>
        <label for="video-url">YouTube URL</label>
        <input
          id="video-url"
          type="url"
          placeholder="https://www.youtube.com/watch?v=..."
          autocomplete="off"
        />
        <button type="submit">読込</button>
      </form>
      <p id="message" class="message" role="alert"></p>
    </header>
    <main class="workspace">
      <section class="video-frame">
        <div id="player"></div>
      </section>
      <aside class="subtitle-list"></aside>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
