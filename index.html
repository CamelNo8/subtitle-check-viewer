<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>字幕チェック</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: #1f2328;
        background: #ffffff;
      }
      .controls {
        padding: 12px 16px;
        border-bottom: 1px solid #d1d9e0;
      }
      .controls form {
        display: flex;
        max-width: 100%;
        gap: 8px;
        align-items: center;
      }
      .controls label {
        white-space: nowrap;
      }
      .controls input[type="url"] {
        width: 480px;
        min-width: 0;
        padding: 6px 8px;
        font-size: 1rem;
      }
      .message {
        margin: 8px 0 0;
        color: #cf222e;
      }
      .message:empty {
        display: none;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        gap: 16px;
        padding: 16px;
      }
      .video-frame {
        aspect-ratio: 16 / 9;
        background: #000000;
      }
      .video-frame iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* 字幕の文字の大きさを動画の幅に合わせるため、この欄の幅を cqw の基準にする */
      .video-column {
        container-type: inline-size;
      }
      .subtitle-bar {
        --line-height: 1.4;
        /* 動画の幅に比例させるが、狭い画面でも読めるよう 16px より小さくしない */
        --min-font-size: 16px;
        min-height: calc(2em * var(--line-height));
        padding: 0.4em 1em;
        background: #000000;
        color: #ffffff;
        font-size: max(var(--min-font-size), 3.2cqw);
        line-height: var(--line-height);
        text-align: center;
      }
      /* contain: size で欄の中身が高さを決めないようにし、左側（動画＋字幕欄）と同じ高さにそろえる */
      .subtitle-panel {
        display: flex;
        flex-direction: column;
        contain: size;
      }
      .subtitle-panel.has-subtitles .srt-drop-zone {
        flex: none;
        min-height: 0;
        padding: 4px 8px;
        border-width: 1px;
        font-size: 0.9rem;
      }
      .srt-drop-zone {
        display: flex;
        flex: 1;
        min-height: 160px;
        align-items: center;
        justify-content: center;
        border: 2px dashed #8c959f;
        border-radius: 8px;
        color: #59636e;
        text-align: center;
        cursor: pointer;
      }
      .srt-drop-zone:hover,
      .srt-drop-zone:focus-within,
      .srt-drop-zone.is-dragover {
        border-color: #0969da;
        background: #ddf4ff;
        color: #0969da;
      }
      /* 見た目は枠で出すので本来の入力欄は隠す。キーボード操作と読み上げのために要素は残す */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .srt-status {
        margin: 8px 0 0;
      }
      .srt-status:empty {
        display: none;
      }
      .srt-status.is-error {
        color: #cf222e;
      }
      /* 警告が多くても一覧の場所を奪わないよう、3行ほどでスクロールさせる */
      .srt-warnings {
        flex: none;
        max-height: 4.5em;
        margin: 4px 0 0;
        overflow: auto;
        color: #9a6700;
      }
      .srt-warnings:empty {
        display: none;
      }
      .subtitle-list-section {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        margin-top: 8px;
      }
      .subtitle-list-section[hidden] {
        display: none;
      }
      .subtitle-list-scroll {
        flex: 1;
        min-height: 0;
        margin-top: 4px;
        overflow: auto;
        border: 1px solid #d1d9e0;
      }
      .subtitle-list {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      .subtitle-list th {
        position: sticky;
        top: 0;
        background: #f6f8fa;
        text-align: left;
        white-space: nowrap;
      }
      .subtitle-list th,
      .subtitle-list td {
        padding: 4px 8px;
        border-bottom: 1px solid #d1d9e0;
        vertical-align: top;
      }
      .subtitle-list td:nth-child(-n + 2) {
        white-space: nowrap;
      }
      .subtitle-text {
        white-space: pre-line;
      }
      .subtitle-text.is-empty {
        color: #8c959f;
      }
      .review-mark {
        margin-left: 4px;
        color: #0969da;
        visibility: hidden;
      }
      .subtitle-list tr.is-reviewed .review-mark {
        visibility: visible;
      }
      .review-fields {
        display: grid;
        gap: 4px;
        margin-top: 4px;
      }
      .review-fields label {
        display: grid;
        grid-template-columns: 4em minmax(0, 1fr);
        gap: 6px;
        align-items: start;
        color: #59636e;
        font-size: 0.8rem;
        cursor: text;
      }
      .review-fields textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 2px 6px;
        border: 1px solid #d1d9e0;
        border-radius: 4px;
        color: #1f2328;
        font: inherit;
        font-size: 0.9rem;
        line-height: 1.4;
        resize: none;
        overflow: hidden;
      }
      .subtitle-list tbody tr {
        cursor: pointer;
      }
      .subtitle-list tbody tr:hover {
        background: #f6f8fa;
      }
      .subtitle-list tbody tr.is-active {
        background: #fff8c5;
      }
      /* 狭い画面では横に並べると一覧の高さが足りないので、動画の下に並べる */
      @media (max-width: 900px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
        }
        .subtitle-panel {
          height: 60vh;
        }
      }
      .jump-button {
        padding: 0;
        border: 0;
        background: none;
        color: #0969da;
        font: inherit;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header class="controls">
      <form id="video-form" novalidate>
        <label for="video-url">YouTube URL</label>
        <input
          id="video-url"
          type="url"
          placeholder="https://www.youtube.com/watch?v=..."
          autocomplete="off"
        />
      </form>
      <p id="message" class="message" role="alert"></p>
    </header>
    <main class="workspace">
      <div class="video-column">
        <section class="video-frame">
          <div id="player"></div>
        </section>
        <div id="subtitle-bar" class="subtitle-bar"></div>
      </div>
      <aside id="subtitle-panel" class="subtitle-panel">
        <label id="srt-drop-zone" class="srt-drop-zone">
          SRTファイルを選択 or ドラッグ
          <input id="srt-file" class="visually-hidden" type="file" accept=".srt" />
        </label>
        <p id="srt-status" class="srt-status" role="status"></p>
        <ul id="srt-warnings" class="srt-warnings"></ul>
        <div id="subtitle-list-section" class="subtitle-list-section" hidden>
          <label>
            <input id="follow-playback" type="checkbox" checked />
            再生位置に追従
          </label>
          <div id="subtitle-list-scroll" class="subtitle-list-scroll">
            <table class="subtitle-list">
              <thead>
                <tr>
                  <th>番号</th>
                  <th>開始</th>
                  <th>字幕</th>
                </tr>
              </thead>
              <tbody id="subtitle-list-body"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
